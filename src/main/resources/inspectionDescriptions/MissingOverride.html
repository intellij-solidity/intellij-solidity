Reports a function or modifier that redefines a member of a base contract without the <code>override</code> specifier,
or with a bare <code>override</code> when several base contracts must be listed, e.g. <code>override(A, B)</code>.
<!-- tooltip end -->
<p>Since Solidity 0.8.8, <code>override</code> is optional when only a single interface function is implemented.</p>
